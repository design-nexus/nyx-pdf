[package]
name = "nyx-pdf"
version = "0.1.0"
description = "A PDF viewer and editor for Omarchy: annotate, fill forms, sign, reorder pages and edit text"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-pdf"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-pdf"
path = "src/main.rs"

[dependencies]
nyx-share-client = { git = "https://github.com/design-nexus/nyx-share.git", rev = "3923640afdcbfe09fa4c1faaf7d952db071f3812" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
serde_json = "1"
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
anyhow = "1.0.104"
async-channel = "2"
cairo-rs = { version = "0.22", features = ["png"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lopdf = "0.45"
poppler = { version = "0.26", package = "poppler-rs", features = ["v24_12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
