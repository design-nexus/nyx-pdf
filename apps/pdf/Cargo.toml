[package]
name = "nyx-pdf"
version = "0.1.0"
description = "A PDF viewer and editor for Omarchy: annotate, fill forms, sign, reorder pages and edit text"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-pdf"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-pdf"
path = "src/main.rs"

[dependencies]
nyx-share-client = { git = "https://github.com/design-nexus/nyx-share.git", rev = "3923640afdcbfe09fa4c1faaf7d952db071f3812" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
serde_json = "1"
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6b2550bf06ea0d8c8c7e52cff03d4236d46d9777" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6b2550bf06ea0d8c8c7e52cff03d4236d46d9777" }
anyhow = "1.0.104"
async-channel = "2"
cairo-rs = { version = "0.22", features = ["png"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lopdf = "0.45"
poppler = { version = "0.26", package = "poppler-rs", features = ["v24_12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
